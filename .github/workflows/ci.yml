name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Sync dependencies
        run: uv sync

      - name: Lint
        run: uv run ruff check app tests

      - name: Run tests
        run: uv run pytest

      # NOTE: `flet build windows` and the Windows QEMU verification step are
      # intentionally NOT included at this stage. They belong to the later
      # packaging plan, once a real UI exists to verify.