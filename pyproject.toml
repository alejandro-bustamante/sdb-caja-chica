[project]
name = "sdb-caja-chica"
version = "0.1.0"
description = "Small shop sales ledger: stock, expenses, debts and cash balance, append-only SQLite."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "flet>=0.24",
    "openpyxl>=3.1",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.5",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]